name: Build Shah Pharmacy APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract project
        run: |
          unzip -q ShahPharmacy_Gradlew_FinalFix.zip -d project

      - name: Find and build
        run: |
          PROJECT=$(dirname "$(find project -name gradlew -type f -print -quit)")
          cd "$PROJECT"
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Shah-Pharmacy-APK
          path: project/**/app/build/outputs/apk/debug/app-debug.apk
