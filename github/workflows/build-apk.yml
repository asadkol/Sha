name: Build Shah Pharmacy APK

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Android Project
        run: |
          unzip -o Shah_Pharmacy_Android.zip
          ls -la Shah_Pharmacy_Android

      - name: Build APK
        run: |
          gradle -p Shah_Pharmacy_Android assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Shah-Pharmacy-APK
          path: Shah_Pharmacy_Android/app/build/outputs/apk/debug/app-debug.apk
