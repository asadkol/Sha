from pathlib import Path

workflow = """name: Build Shah Pharmacy APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: Shah_pharm

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Shah-Pharmacy-Debug-APK
          path: Shah_pharm/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
"""

path = Path("/mnt/data/build.yml")
path.write_text(workflow, encoding="utf-8", newline="\n")
print(f"Created: {path}")
